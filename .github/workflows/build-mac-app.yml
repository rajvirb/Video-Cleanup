# Builds the Mac app on GitHub's Macs. Download it from the run's "Artifacts",
# or push a tag like v1.0.0 to publish it as a release anyone can download.
name: Build Mac app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest       # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build and check the app
        run: |
          set -o pipefail
          ./build_app.sh 2>&1 | tee build.log
      - name: Show the app's self-test results
        if: always()
        # as an annotation, which shows on the run's summary page
        run: |
          msg=$(grep -E '^(ok|WARN|FAIL) ' build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Self-test::$msg"
      - name: Show why the build failed
        if: failure()
        # the end of the build log as an annotation, which shows on the run's summary page
        run: |
          # annotations are cut off after a few KB, so leave out PyInstaller's warnings
          msg=$(grep -v -E 'WARNING|SyntaxWarning|^  title=|^  \)$' build.log | tail -n 30 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: Sift (Apple Silicon)
          path: dist/Sift.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Sift.zip" --title "Sift $GITHUB_REF_NAME" --generate-notes

  # The native Mac app (mac/): SiftCore's tests, then an unsigned build of Sift.app.
  native:
    name: Native app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SiftCore
        run: |
          set -o pipefail
          swift test --package-path mac/SiftCore 2>&1 | tee native.log
      - name: Build the app
        run: |
          set -o pipefail
          brew install xcodegen
          cd mac && xcodegen generate --quiet
          xcodebuild -project Sift.xcodeproj -scheme Sift -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ../native.log | grep -E "error|warning: .*Sift/|BUILD" || true
          grep -q "BUILD SUCCEEDED" ../native.log
      - name: Show why it failed
        if: failure()
        run: |
          echo "Xcode $(xcodebuild -version | head -1)"
          msg=$(grep -E "error:|failed|FAILED|Executed .* tests" native.log | grep -v "^ *$" | sort -u | head -n 40 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Native build failed::$msg"
